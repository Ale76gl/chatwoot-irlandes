name: Build Irlandes Chatwoot

on:
  workflow_dispatch:
  push:
    branches:
      - irlandes-custom
    paths:
      - 'app/**'
      - 'enterprise/**'
      - 'docker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/build-irlandes.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ale76gl/chatwoot-irlandes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ale76gl/chatwoot-irlandes:4.17.1-irlandes-11
            ghcr.io/ale76gl/chatwoot-irlandes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
